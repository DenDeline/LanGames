name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        run: pnpm test:frontend
      - name: Build frontend
        run: pnpm build
      - name: Test .NET solution
        run: dotnet test --solution LanPong.slnx --configuration Release
      - name: Verify production dependency boundary
        run: python tests/integration/verify_production_boundary.py
      - name: Smoke-test developer bot diagnostics
        env:
          LANPONG_DIAGNOSTICS_DLL: ${{ github.workspace }}/tools/LanPong.BotDiagnostics/bin/Release/net10.0/LanPong.BotDiagnostics.dll
        run: python tests/integration/bot_diagnostics_smoke_test.py
      - name: Run integration tests
        run: python tests/integration/integration_test.py
